<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Net Fare Calculator by সাকিব</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16302a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Net Fare Calc">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chassis-1:#22564d;
    --chassis-2:#0f332c;
    --chassis-edge:#081f1a;
    --chassis-shine:rgba(255,255,255,0.08);
    --gold:#d9a94c;
    --gold-bright:#f0c878;
    --gold-dim:#8a692b;
    --lcd-bg-1:#c9dd9d;
    --lcd-bg-2:#b5cc85;
    --lcd-ink:#1f3a14;
    --lcd-ink-dim:#4f6d3c;
    --paper:#efe9d9;
    --paper-edge:#d9d1b8;
    --paper-ink:#2c2a20;
    --key-num-1:#f6f2e6;
    --key-num-2:#e2ddc9;
    --key-num-ink:#1d2a26;
    --key-op-1:#ea8a3d;
    --key-op-2:#c96522;
    --key-op-ink:#3a1a05;
    --key-clear-1:#d1543a;
    --key-clear-2:#a83421;
    --sans-bn:'Noto Sans Bengali','Segoe UI',sans-serif;
    --display-bn:'Baloo Da 2','Noto Sans Bengali',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
    --digital:'Share Tech Mono',var(--mono);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 14px;
    font-family:var(--sans-bn);
    background:
      radial-gradient(circle at 20% 15%, #3a6a5d 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, #24413a 0%, transparent 50%),
      #16302a;
    color:var(--paper-ink);
  }

  /* ===== Calculator shell ===== */
  .calc{
    width:100%;
    max-width:420px;
    border-radius:26px;
    padding:16px 16px 20px;
    background:
      linear-gradient(155deg, var(--chassis-shine), transparent 30%),
      linear-gradient(150deg, var(--chassis-1), var(--chassis-2) 65%);
    box-shadow:
      0 30px 60px -25px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -6px 14px rgba(0,0,0,0.35);
    position:relative;
    border:1px solid var(--chassis-edge);
  }
  .screw{
    position:absolute;
    width:9px;height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #cfd4cf, #6c716c 55%, #33362f);
    box-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .screw.tl{top:10px;left:10px;}
  .screw.tr{top:10px;right:10px;}
  .screw.bl{bottom:10px;left:10px;}
  .screw.br{bottom:10px;right:10px;}

  /* ===== Brand plate ===== */
  .brand-plate{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px 14px;
    margin-bottom:12px;
  }
  .solar{
    flex:0 0 auto;
    width:46px;height:26px;
    border-radius:3px;
    background:
      repeating-linear-gradient(90deg,#3a4a52 0 5px, #24343c 5px 6px),
      linear-gradient(160deg,#4a5c66,#1c2a30);
    border:1px solid #0c1417;
    box-shadow:inset 0 0 4px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.06);
  }
  .brand-text{flex:1; min-width:0;}
  .brand-name{
    display:block;
    font-family:var(--display-bn);
    font-weight:800;
    font-size:17px;
    letter-spacing:.01em;
    color:var(--gold-bright);
    text-shadow:0 1px 0 rgba(0,0,0,0.4);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-by{
    display:block;
    margin-top:2px;
    font-family:var(--display-bn);
    font-weight:600;
    font-size:13px;
    color:#dce8dd;
    opacity:.85;
  }
  .model-no{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.12em;
    color:var(--gold-dim);
    border:1px solid var(--gold-dim);
    border-radius:20px;
    padding:3px 8px;
  }

  /* ===== LCD screen ===== */
  .screen-unit{
    padding:0 10px;
    margin-bottom:12px;
  }
  .lcd{
    position:relative;
    border-radius:10px;
    padding:14px 16px 12px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 4px),
      linear-gradient(155deg, var(--lcd-bg-1), var(--lcd-bg-2));
    border:2px solid #17241d;
    box-shadow:
      inset 0 3px 10px rgba(0,0,0,0.35),
      inset 0 -2px 6px rgba(255,255,255,0.15);
    overflow:hidden;
  }
  .lcd-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--digital);
    color:var(--lcd-ink);
  }
  .lcd-row.small{
    font-size:12px;
    color:var(--lcd-ink-dim);
    letter-spacing:.06em;
  }
  .lcd-row.small .lcd-value{font-size:14px; font-weight:700; color:var(--lcd-ink);}
  .lcd-row.main{
    margin:6px 0 4px;
    padding-top:6px;
    border-top:1px dashed rgba(31,58,20,0.35);
  }
  .lcd-label{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.12em;
  }
  .lcd-value.big{
    font-size:30px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .lcd-row.profit{margin-top:4px;}
  .lcd-row.profit .lcd-value{color:#2c5c1f;}

  /* ===== Receipt tape ===== */
  .tape{
    margin:0 8px 14px;
    background:var(--paper);
    border:1px solid var(--paper-edge);
    border-radius:2px;
    padding:12px 14px 10px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--paper-ink);
    position:relative;
    box-shadow:0 6px 14px -8px rgba(0,0,0,0.5);
  }
  .tape::before{
    content:"";
    position:absolute;
    top:-6px; left:0; right:0; height:6px;
    background:
      radial-gradient(circle at 6px 6px, var(--chassis-2) 3px, transparent 3.5px) repeat-x;
    background-size:14px 12px;
  }
  .tape-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:3px 0;
    border-bottom:1px dotted var(--paper-edge);
  }
  .tape-row:last-child{border-bottom:none;}
  .tape-row span{color:#5c5644;}
  .tape-row b{font-weight:700;}
  .tape-row.minus b{color:#a13a24;}
  .tape-row:not(.minus) b{color:#1f6b3f;}

  /* ===== Keypad ===== */
  .keypad{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:0 8px;
  }
  .key label{
    display:block;
    font-size:11.5px;
    font-weight:700;
    color:#d9e6da;
    margin-bottom:5px;
    letter-spacing:.02em;
  }
  .key-face{
    position:relative;
    display:flex;
    align-items:center;
    border-radius:10px;
    background:linear-gradient(180deg, var(--key-num-1), var(--key-num-2));
    box-shadow:
      0 3px 0 #9a9683,
      0 6px 10px -4px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.6);
    border:1px solid #b6b19b;
  }
  .key-face .taka{
    padding-left:12px;
    font-family:var(--mono);
    font-weight:700;
    color:var(--key-num-ink);
    opacity:.7;
  }
  .key-face input{
    width:100%;
    border:none;
    background:transparent;
    padding:11px 12px 11px 6px;
    font-family:var(--digital);
    font-size:16px;
    font-weight:700;
    color:var(--key-num-ink);
    outline:none;
  }
  .key-face input::placeholder{color:#9a9584;}
  .key-face.op{
    background:linear-gradient(180deg, var(--key-op-1), var(--key-op-2));
    border-color:#a34e18;
    box-shadow:
      0 3px 0 #8a4315,
      0 6px 10px -4px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .key-face.op .taka{color:var(--key-op-ink); opacity:.75;}
  .key-face.op input{color:var(--key-op-ink);}
  .key-face.op input::placeholder{color:rgba(58,26,5,0.55);}

  .key.wide{grid-column:1 / -1;}

  .clear-key{
    grid-column:1 / -1;
    border:1px solid #7a2a1a;
    border-radius:10px;
    padding:12px 14px;
    background:linear-gradient(180deg, var(--key-clear-1), var(--key-clear-2));
    box-shadow:
      0 3px 0 #7a2a1a,
      0 6px 10px -4px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.3);
    color:#fff2ea;
    font-family:var(--display-bn);
    font-weight:700;
    font-size:15px;
    letter-spacing:.06em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .clear-key span{
    font-family:var(--sans-bn);
    font-weight:600;
    font-size:12.5px;
    opacity:.85;
  }
  .clear-key:active{
    transform:translateY(3px);
    box-shadow:
      0 0 0 #7a2a1a,
      inset 0 2px 6px rgba(0,0,0,0.4);
  }
  .key input:focus + span,
  .key-face:focus-within{
    box-shadow:
      0 3px 0 #9a9683,
      0 0 0 3px rgba(217,169,76,0.55),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }

  @media (max-width:400px){
    .lcd-value.big{font-size:25px;}
    .brand-name{font-size:15px;}
  }
</style>
</head>
<body>

<div class="calc">
  <span class="screw tl"></span>
  <span class="screw tr"></span>
  <span class="screw bl"></span>
  <span class="screw br"></span>

  <div class="brand-plate">
    <div class="solar"></div>
    <div class="brand-text">
      <span class="brand-name">Net Fare Calculator</span>
      <span class="brand-by">by সাকিব</span>
    </div>
    <div class="model-no">NF‑100</div>
  </div>

  <div class="screen-unit">
    <div class="lcd">
      <div class="lcd-row small">
        <span class="lcd-label">Purchase</span>
        <span class="lcd-value" id="outPurchase">৳ 0.00</span>
      </div>
      <div class="lcd-row main">
        <span class="lcd-label">Sell Price</span>
        <span class="lcd-value big" id="outSell">৳ 0.00</span>
      </div>
      <div class="lcd-row small profit">
        <span class="lcd-label">প্রফিট</span>
        <span class="lcd-value" id="outProfit">৳ 0.00</span>
      </div>
    </div>
  </div>

  <div class="tape">
    <div class="tape-row"><span>AIT (Gross × 0.3%)</span><b id="outAit">৳ 0.00</b></div>
    <div class="tape-row"><span>Tax (Gross − Base)</span><b id="outTax">৳ 0.00</b></div>
    <div class="tape-row minus"><span>কমিশন (Base × 7%)</span><b id="outComm">৳ 0.00</b></div>
  </div>

  <div class="keypad">
    <div class="key">
      <label>Gross Fare</label>
      <div class="key-face">
        <span class="taka">৳</span>
        <input type="number" id="gross" placeholder="0" inputmode="decimal">
      </div>
    </div>
    <div class="key">
      <label>Base Fare</label>
      <div class="key-face">
        <span class="taka">৳</span>
        <input type="number" id="base" placeholder="0" inputmode="decimal">
      </div>
    </div>
    <div class="key wide">
      <label>মার্জিন / চার্জ যোগ করুন</label>
      <div class="key-face op">
        <span class="taka">৳</span>
        <input type="number" id="charge" placeholder="0" inputmode="decimal" value="0">
      </div>
    </div>
    <button class="clear-key" onclick="resetAll()">AC <span>রিসেট করুন</span></button>
  </div>
</div>

<script>
  const grossEl = document.getElementById('gross');
  const baseEl = document.getElementById('base');
  const chargeEl = document.getElementById('charge');

  const outAit = document.getElementById('outAit');
  const outTax = document.getElementById('outTax');
  const outComm = document.getElementById('outComm');
  const outPurchase = document.getElementById('outPurchase');
  const outSell = document.getElementById('outSell');
  const outProfit = document.getElementById('outProfit');

  function fmt(n){
    if(isNaN(n)) n = 0;
    return '৳ ' + n.toLocaleString('en-BD', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function calculate(){
    const gross = parseFloat(grossEl.value) || 0;
    const base = parseFloat(baseEl.value) || 0;
    const charge = parseFloat(chargeEl.value) || 0;

    const ait = gross * 0.3 / 100;
    const tax = gross - base;
    const commission = base * 7 / 100;

    // Purchase Price = AIT + Tax + (Base − Commission)
    const purchase = ait + tax + (base - commission);
    const sell = purchase + charge;
    const profit = sell - purchase;

    outAit.textContent = fmt(ait);
    outTax.textContent = fmt(tax);
    outComm.textContent = fmt(commission);
    outPurchase.textContent = fmt(purchase);
    outSell.textContent = fmt(sell);
    outProfit.textContent = fmt(profit);
  }

  function resetAll(){
    grossEl.value = '';
    baseEl.value = '';
    chargeEl.value = '0';
    calculate();
  }

  [grossEl, baseEl, chargeEl].forEach(el => el.addEventListener('input', calculate));
  calculate();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
</script>

</body>
</html>
